<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>MORDEN2 — MSX2 Mode 2 Sprite Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Silkscreen&display=swap" />
<link rel="stylesheet" href="src/style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar" data-help="layout">
      <div class="brand" data-help="overview">
        <span id="brand-logo"></span>
        <div class="brand-text">
          <span class="brand-name">MORDEN2</span>
          <span class="brand-sub">MSX2 Mode 2 sprite editor</span>
        </div>
      </div>
      <nav id="menu-host" class="menus" aria-label="Main menu"></nav>
      <div id="history-host" class="history" data-help="undo-redo"></div>
      <div class="topbar-spacer"></div>
      <div class="palette-type" data-help="palette-type">
        <span class="palette-type-label">Palette</span>
        <div id="palette-type-host" class="segmented" role="group" aria-label="Palette"></div>
      </div>
      <div id="help-host"></div>
      <a class="publisher-link" href="https://rutagamesltda.itch.io/" target="_blank" rel="noopener" title="RutaGames on itch.io"><img class="publisher-logo" src="assets/rutagames-logo.png" alt="RutaGames" width="66" height="44" data-help="overview" /></a>
    </header>

    <div class="app-body">
      <aside id="tool-rail" class="tool-rail" aria-label="Tools" data-help="layout"></aside>

      <main class="workspace" data-help="sprites">
        <div class="workspace-head" data-help="or-mode">
          <h1>Sprites</h1>
          <span class="workspace-hint">An OR sprite mixes its color with the sprite before it.</span>
        </div>
        <div id="import-message-host" role="status" aria-live="polite" data-help="import"></div>
        <div id="grids-host"></div>
      </main>

      <aside class="side-panel" data-help="layout">
        <section class="panel-section" data-help="palette">
          <h2 class="panel-title">Color</h2>
          <div id="palette-host"></div>
        </section>
        <section class="panel-section" data-help="preview">
          <div class="panel-title-row">
            <h2 class="panel-title">Preview</h2>
            <div id="zoom-host" class="segmented segmented-sm" role="group" aria-label="Preview zoom"></div>
          </div>
          <div id="preview-host"></div>
        </section>
      </aside>
    </div>

    <footer id="status-host" class="statusbar" aria-live="polite" data-help="status-bar"></footer>
  </div>
  <script type="module" src="src/app.js"></script>
</body>
</html>
